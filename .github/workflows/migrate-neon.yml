name: Migración BD → Neon (una sola vez)

# Corre backend/db/migrate_to_neon.py en un runner de GitHub, sin instalar nada localmente.
# Requiere los secrets SOURCE_DATABASE_URL y NEON_DATABASE_URL (Settings → Secrets and variables → Actions).
# Es seguro re-ejecutarlo: si Neon ya tiene tablas, el script se detiene sin tocar nada.
on:
  push:
    branches: [claude/migracion-neon]
    paths: [.github/workflows/migrate-neon.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Verificar secrets
        run: |
          if [ -z "$SOURCE_DATABASE_URL" ] || [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::Faltan los secrets SOURCE_DATABASE_URL y/o NEON_DATABASE_URL"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL 18 (pg_dump / psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar psycopg2
        run: pip install psycopg2-binary==2.9.11

      - name: Migrar
        working-directory: backend
        run: |
          pg_dump --version
          python3 db/migrate_to_neon.py

      # Solo la estructura (sin datos personales) para versionarla en el repo
      - name: Publicar schema.sql
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-sql
          path: backend/db/schema.sql
          if-no-files-found: ignore
          retention-days: 7
